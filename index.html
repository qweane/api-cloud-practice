<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Мой первый API клиент</title>
</head>
<body>
    <h1>Данные из Облака (PokeAPI)</h1>
    <button id="loadBtn">Загрузить данные через API</button>
    <ul id="userList"></ul>

    <script>
        const button = document.getElementById('loadBtn');
        const list = document.getElementById('userList');

        button.addEventListener('click', async () => {
            button.innerText = 'Загрузка...';
            list.innerHTML = ''; // Очищаем список перед загрузкой

            try {
                const response = await fetch('https://pokeapi.co/api/v2/pokemon/pikachu');
                
                // Проверяем, успешен ли запрос
                if (!response.ok) throw new Error('Ошибка сети');
                
                const user = await response.json(); // Изменили имя переменной на user (в единственном числе)

                const li = document.createElement('li');
                // Теперь свойства name и weight будут успешно прочитаны из объекта покемона
                li.innerText = `Имя: ${user.name} | Вес: ${user.weight}`;
                list.appendChild(li);

                button.innerText = 'Данные загружены!';
            } catch (error) {
                console.error(error);
                button.innerText = 'Ошибка загрузки!';
                list.innerHTML = '<li>Не удалось получить данные</li>';
            }
        });
    </script>
</body>
</html>
